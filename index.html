<!DOCTYPE html>
<html lang="es-CL">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Academia de Fútbol Newen | Propuestas de sitio</title>
  <meta name="description" content="Tres propuestas de landing para Academia de Fútbol Newen, academia de fútbol para adultos en Temuco y Padre Las Casas, con un selector para compararlas.">
  <meta name="robots" content="noindex, nofollow">
  <link rel="canonical" href="https://academia-newen.github.io/">
  <meta name="theme-color" content="#0b0f0a">

  <link rel="icon" type="image/png" href="/img/icono-180.png">
  <link rel="apple-touch-icon" href="/img/icono-180.png">

  <meta property="og:title" content="Academia de Fútbol Newen | Propuestas de sitio">
  <meta property="og:description" content="Tres propuestas de landing para Academia de Fútbol Newen, academia de fútbol para adultos en Temuco y Padre Las Casas, con un selector para compararlas.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://academia-newen.github.io/">
  <meta property="og:locale" content="es_CL">
  <meta property="og:site_name" content="Academia de Fútbol Newen">
  <meta property="og:image" content="https://academia-newen.github.io/img/plantel-padre-las-casas.jpg">
</head>
<body>

  <h1 class="nw-solo-lectores">Academia de Fútbol Newen: propuestas de sitio</h1>

  <!-- Cada dirección es una página completa dentro de su propio documento. El
       marco la muestra a pantalla completa y le cambia la fuente cuando el
       toggle pasa a la siguiente, igual que en kuyen-web. -->
  <iframe id="nw-marco" title="Propuesta Noche de cancha" src="/t/a"></iframe>

  <!-- ThemeToggle: copia del de Pagos Pendientes y Tipo de Cambio
       (src/components/theme-toggle.tsx en los dos repos), en su tamaño sm y con
       sus tres posiciones originales. Mismas clases traducidas a CSS, mismos
       colores del tema oscuro. A la izquierda y centrado verticalmente, como
       en kuyen-web (pedido de Camilo, 10-09-2026).

       La única diferencia con PP es por el contenido: en vez de poner una clase
       en <html> cambia la fuente del marco, porque cada propuesta vive en su
       propio documento. -->
  <div class="nw-posicion">
    <button type="button" class="nw-toggle" aria-label="Cambiar de propuesta" title="Propuesta Noche de cancha" data-tema-boton>
      <span class="nw-knob" data-tema-knob><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg></span>
    </button>
  </div>

<style>
  html, body { height: 100%; margin: 0; background: #fff; }
  .nw-solo-lectores {
    position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
  }
  #nw-marco { display: block; width: 100%; height: 100%; border: 0; background: #fff; }

  /* absolute left-4 top-1/2 -translate-y-1/2 z-10 */
  .nw-posicion { position: absolute; left: 1rem; top: 50%; transform: translateY(-50%); z-index: 10; }

  /* relative inline-flex items-center rounded-full transition-colors duration-200
     h-7 w-[4.5rem] bg-muted-foreground/40, con los tokens del tema dark de PP
     (--muted-foreground: 0 0% 63.9%). Tres posiciones: el ancho de PP tal cual. */
  .nw-toggle {
    position: relative;
    display: inline-flex;
    align-items: center;
    height: 1.75rem;
    width: 4.5rem;
    padding: 0;
    border: 0;
    border-radius: 9999px;
    background-color: hsl(0 0% 63.9% / 0.4);
    cursor: pointer;
    transition: color, background-color, border-color, fill, stroke;
    transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
    transition-duration: 200ms;
  }
  /* focus:outline-none focus:ring-2 focus:ring-ring focus:ring-offset-2
     focus:ring-offset-background (--ring: 25 95% 53%, --background: 0 0% 3.9%) */
  .nw-toggle:focus {
    outline: 2px solid transparent;
    outline-offset: 2px;
    box-shadow: 0 0 0 2px hsl(0 0% 3.9%), 0 0 0 4px hsl(25 95% 53%);
  }

  /* inline-flex items-center justify-center rounded-full bg-white shadow-sm
     transform transition-transform duration-200 h-5 w-5 translate-x-1 */
  .nw-knob {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    height: 1.25rem;
    width: 1.25rem;
    border-radius: 9999px;
    background-color: #fff;
    box-shadow: 0 1px 2px 0 rgb(0 0 0 / 0.05);
    transform: translateX(0.25rem);
    transition: transform 200ms cubic-bezier(0.4, 0, 0.2, 1);
  }
  /* h-3 w-3 del icono */
  .nw-knob svg { height: 0.75rem; width: 0.75rem; }
</style>

<script>
  (function () {
    'use strict'

    var TEMAS = [{"id":"a","nombre":"Noche de cancha","icono":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z\"/></svg>","ruta":"/t/a"},{"id":"b","nombre":"Club institucional","icono":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z\"/></svg>","ruta":"/t/b"},{"id":"c","nombre":"Editorial fotográfico","icono":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z\"/><circle cx=\"12\" cy=\"13\" r=\"3\"/></svg>","ruta":"/t/c"}]
    var CLAVE = 'newen-tema'

    // POSITIONS del toggle sm de PP: translate-x-1, translate-x-[1.625rem],
    // translate-x-[3rem]. Tres opciones, tres posiciones, sin agregar pasos.
    var POSICIONES = TEMAS.map(function (_, i) { return 0.25 + 1.375 * i })

    // iconClass de PP: la primera opción (dark) en text-muted-foreground y las
    // demás en text-primary, con los tokens del tema dark.
    var COLOR_PRIMERA = 'hsl(0 0% 63.9%)'
    var COLOR_RESTO = 'hsl(25 95% 53%)'

    var marco = document.getElementById('nw-marco')
    var boton = document.querySelector('[data-tema-boton]')
    var knob = document.querySelector('[data-tema-knob]')
    if (!marco || !boton || !knob) return

    var indice = 0
    try {
      var guardado = localStorage.getItem(CLAVE)
      for (var i = 0; i < TEMAS.length; i++) if (TEMAS[i].id === guardado) indice = i
    } catch (e) {}

    function aplicar(i, cargar) {
      var tema = TEMAS[i]
      var siguiente = TEMAS[(i + 1) % TEMAS.length]

      if (cargar) marco.src = tema.ruta
      marco.title = 'Propuesta ' + tema.nombre

      knob.style.transform = 'translateX(' + POSICIONES[i] + 'rem)'
      knob.style.color = i === 0 ? COLOR_PRIMERA : COLOR_RESTO
      knob.innerHTML = tema.icono

      // Como en PP: title con la opción activa, aria-label con la siguiente.
      boton.setAttribute('title', 'Propuesta ' + tema.nombre)
      boton.setAttribute('aria-label', 'Cambiar a Propuesta ' + siguiente.nombre)

      try { localStorage.setItem(CLAVE, tema.id) } catch (e) {}
    }

    // El primer render ya trae la propuesta por defecto en el src; solo se
    // recarga el marco si lo guardado es otra.
    aplicar(indice, indice !== 0)

    // Ciclo: A -> B -> C -> A
    boton.addEventListener('click', function () {
      indice = (indice + 1) % TEMAS.length
      aplicar(indice, true)
    })
  })()
</script>

</body>
</html>
